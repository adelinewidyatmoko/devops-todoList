name: 'CI - Verify and Build Next.js'

on:
  push:
    branches: [ci_role]
  # Changed pull_request to target the branch so CI runs when PRs are opened against it
  pull_request:
    branches: [ci_role]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

        # 4. Code Quality: Check formatting with Prettier
      - name: Check Formatting (Prettier)
        run: npx prettier --check .

      # 5. Code Quality: Run ESLint
      - name: Lint Code (ESLint)
        run: npx eslint "**/*.js"

      # Added: Good CI should always run your test suite
      - name: Run Tests
        run: npm test
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
      # e2e test
      - name: Run Cypress E2E  tests
        uses: cypress-io/github-action@v5
        with:
          # Tell cypress to ignore peer dependency conflicts during install
          install-command: npm ci --legacy-peer-deps
          start: npm start
          wait-on: 'http://localhost:4000'

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
