name: CI/CD - Unified Pipeline

on:
  push:
    branches: [ci_role, cd_role, main]
  pull_request:
    branches: [ci_role, cd_role, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 1: CI (Quality Checks & Testing)
  # ────────────────────────────────────────────────────────────────────────────
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # 4. Code Quality: Check formatting with Prettier
      - name: Check Formatting (Prettier)
        run: npx prettier --check .

      # 5. Code Quality: Run ESLint
      - name: Lint Code (ESLint)
        run: npx eslint "**/*.js"

      # Added: Good CI should always run your test suite
      - name: Run Tests
        run: npm test
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}

      # e2e test
      - name: Run Cypress E2E tests
        uses: cypress-io/github-action@v5
        env:
          MONGODB_URL: ${{ secrets.MONGODB_URL }}
          PORT: 4000
          CYPRESS_BASE_URL: http://localhost:4000
        with:
          # Tell cypress to ignore peer dependency conflicts during install
          install-command: npm ci --legacy-peer-deps
          start: npm start
          wait-on: 'http://localhost:4000'

      - name: Build Next.js application
        run: npm run build
        env:
          NODE_ENV: production
          MONGODB_URL: ${{ secrets.MONGODB_URL }}

  # ────────────────────────────────────────────────────────────────────────────
  # STAGE 2: CD (Deployment)
  # ────────────────────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only deploy on push to cd_role
    if: github.event_name == 'push' && github.ref == 'refs/heads/cd_role'
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --legacy-peer-deps
      - name: Deploy to Azure (Staging)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_APP_NAME_STAGING }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_STAGING }}
          package: .

  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only deploy on push to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install production dependencies
        run: npm ci --omit=dev --legacy-peer-deps
      - name: Deploy to Azure (Production)
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_APP_NAME_PRODUCTION }}
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_PRODUCTION }}
          package: .
